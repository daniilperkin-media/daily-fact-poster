# Continuous integration for the Daily Fact Poster pipeline.
#
# Gates (identical to the local ones):
#   1. compileall — syntax check for every module
#   2. ruff check — lint
#   3. pytest     — unit tests + the offline end-to-end smoke test
#                   (script/image generation mocked, real FFmpeg + card
#                   builder; skipped automatically when FFmpeg is missing)
#
# Python 3.10 is the documented floor, 3.12 the development version; the
# Windows leg mirrors the production environment (scheduler + clipboard).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg (the offline smoke test needs it on PATH)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg --no-progress -y
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Syntax-check pipeline modules (compile-only, no heavy imports)
        run: python -m compileall -q .

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test (unit + offline end-to-end smoke)
        run: python -m pytest tests -q
